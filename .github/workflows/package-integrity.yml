name: Package integrity

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  safe-package-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
      - name: Verify release-safe package contents
        run: Rscript tests/package_checks/00_validate_release_package.R
